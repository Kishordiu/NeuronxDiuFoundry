<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto">
  <defs>
    <!-- Ultra-Violet Obsidian & Neural Matrix Gradients -->
    <radialGradient id="neuralVoid" cx="72%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E0D36" />
      <stop offset="45%" stop-color="#0E061A" />
      <stop offset="100%" stop-color="#05020A" />
    </radialGradient>

    <!-- Synaptic Electric Violet & Cyan Radiance -->
    <radialGradient id="synapticGlow" cx="74%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05020A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="prismaticBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#EC4899" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neural Dot Lattice -->
    <pattern id="synapticGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#8B5CF6" opacity="0.18" />
    </pattern>

    <!-- Keyframe Motion Animations -->
    <style>
      @keyframes synapsePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #8B5CF6); }
        50% { transform: scale(1.22); filter: drop-shadow(0 0 18px #06B6D4); }
      }
      @keyframes axonFire {
        0% { stroke-dashoffset: 200; opacity: 0.2; }
        50% { stroke-dashoffset: 0; opacity: 0.95; }
        100% { stroke-dashoffset: -200; opacity: 0.2; }
      }
      @keyframes neuralGimbal {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .synapse-node-1 { transform-origin: 740px 145px; animation: synapsePulse 3s ease-in-out infinite; }
      .synapse-node-2 { transform-origin: 670px 100px; animation: synapsePulse 3.5s ease-in-out 0.5s infinite; }
      .synapse-node-3 { transform-origin: 810px 100px; animation: synapsePulse 3.2s ease-in-out 1s infinite; }
      .synapse-node-4 { transform-origin: 660px 190px; animation: synapsePulse 3.8s ease-in-out 1.5s infinite; }
      .synapse-node-5 { transform-origin: 820px 190px; animation: synapsePulse 3.4s ease-in-out 2s infinite; }

      .axon-stream-1 { stroke-dasharray: 40 60; animation: axonFire 3s linear infinite; }
      .axon-stream-2 { stroke-dasharray: 30 50; animation: axonFire 4s linear infinite; }
      .tensor-gimbal { transform-origin: 740px 145px; animation: neuralGimbal 28s linear infinite; }

      .headline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist Sans", sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
        fill: #FAF5FF;
      }
      .mono-chip {
        font-family: "JetBrains Mono", Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Obsidian Neural Plate -->
  <rect width="960" height="320" rx="24" fill="url(#neuralVoid)" />
  <rect width="960" height="320" rx="24" fill="url(#synapticGrid)" />
  <rect width="960" height="320" rx="24" fill="url(#synapticGlow)" />
  
  <!-- Outer Prismatic Ultra-Violet Border -->
  <rect x="2" y="2" width="956" height="316" rx="22" fill="none" stroke="url(#prismaticBorder)" stroke-width="1.8" />
  <path d="M 28 6 L 932 6" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />

  <!-- ==================== SYNAPTIC NEURAL GRAPH & TENSOR MATRIX ==================== -->

  <!-- Latent Space Tensor Ring -->
  <g class="tensor-gimbal" opacity="0.4">
    <ellipse cx="740" cy="145" rx="145" ry="70" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="6 8" />
    <ellipse cx="740" cy="145" rx="120" ry="110" fill="none" stroke="#06B6D4" stroke-width="0.8" stroke-dasharray="3 6" />
    <circle cx="885" cy="145" r="3.5" fill="#EC4899" />
    <circle cx="620" cy="145" r="3" fill="#06B6D4" />
  </g>

  <!-- Synaptic Axon Pathways (Firing Connections) -->
  <g stroke-linecap="round">
    <line x1="740" y1="145" x2="670" y2="100" stroke="#8B5CF6" stroke-width="2" class="axon-stream-1" />
    <line x1="740" y1="145" x2="810" y2="100" stroke="#06B6D4" stroke-width="2" class="axon-stream-2" />
    <line x1="740" y1="145" x2="660" y2="190" stroke="#EC4899" stroke-width="2" class="axon-stream-1" />
    <line x1="740" y1="145" x2="820" y2="190" stroke="#8B5CF6" stroke-width="2" class="axon-stream-2" />
    <line x1="670" y1="100" x2="810" y2="100" stroke="#A78BFA" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 6" />
    <line x1="660" y1="190" x2="820" y2="190" stroke="#67E8F9" stroke-width="1.2" opacity="0.4" stroke-dasharray="4 6" />
    <line x1="670" y1="100" x2="660" y2="190" stroke="#F472B6" stroke-width="1" opacity="0.3" />
    <line x1="810" y1="100" x2="820" y2="190" stroke="#818CF8" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Central High-Order Synaptic Tensor Node -->
  <g class="synapse-node-1">
    <circle cx="740" cy="145" r="16" fill="#180A2E" stroke="#8B5CF6" stroke-width="2.2" />
    <circle cx="740" cy="145" r="6" fill="#FAF5FF" />
  </g>

  <!-- Satellite Layer Nodes -->
  <g class="synapse-node-2">
    <circle cx="670" cy="100" r="10" fill="#0C1D2B" stroke="#06B6D4" stroke-width="1.8" />
    <circle cx="670" cy="100" r="3.5" fill="#E0F2FE" />
  </g>
  <g class="synapse-node-3">
    <circle cx="810" cy="100" r="11" fill="#240A1F" stroke="#EC4899" stroke-width="1.8" />
    <circle cx="810" cy="100" r="4" fill="#FDF2F8" />
  </g>
  <g class="synapse-node-4">
    <circle cx="660" cy="190" r="9" fill="#1E0A29" stroke="#A855F7" stroke-width="1.6" />
    <circle cx="660" cy="190" r="3" fill="#FAF5FF" />
  </g>
  <g class="synapse-node-5">
    <circle cx="820" cy="190" r="10" fill="#082029" stroke="#22D3EE" stroke-width="1.6" />
    <circle cx="820" cy="190" r="3.5" fill="#ECFEFF" />
  </g>

  <!-- High-Concept Creative Tech HUD Card -->
  <g transform="translate(635, 248)" class="mono-chip">
    <rect x="0" y="0" width="285" height="46" rx="10" fill="#130924" stroke="#5B21B6" stroke-width="1" opacity="0.95" />
    <circle cx="14" cy="17" r="3.5" fill="#8B5CF6" />
    <text x="26" y="20" fill="#C4B5FD" font-size="10" font-weight="700">CREATIVE TECH · NEXT.JS 15 + GSAP</text>
    <text x="14" y="36" fill="#67E8F9" font-size="8.5">LENIS SMOOTH · LATENT SPACE MANIFOLD</text>
  </g>

  <!-- ==================== LEFT EDITORIAL & IDENTITY BLOCK ==================== -->
  <g transform="translate(52, 54)">
    <rect x="0" y="0" width="265" height="28" rx="14" fill="#240F42" stroke="#7C3AED" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4.5" fill="#8B5CF6" />
    <text x="28" y="18" fill="#DDD6FE" class="mono-chip" font-size="11" font-weight="700">CREATIVE AI · HACKATHON SUMMIT</text>

    <text x="0" y="80" class="headline-text" font-size="44">NEURON × DIU FOUNDRY</text>

    <text x="0" y="122" fill="#E9D5FF" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      Experimental Cognitive Architectures, Smooth Kinetics &amp; Design R&amp;D
    </text>

    <!-- Electric Prismatic Accent Strip -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="45" height="3" fill="#8B5CF6" rx="1.5" />
      <rect x="49" y="0" width="55" height="3" fill="#06B6D4" rx="1.5" />
      <rect x="108" y="0" width="35" height="3" fill="#EC4899" rx="1.5" />
    </g>

    <!-- Tech Specs Badges -->
    <g transform="translate(0, 182)" class="mono-chip" font-size="10.5">
      <rect x="0" y="0" width="115" height="22" rx="6" fill="#17092E" stroke="#5B21B6" stroke-width="1" />
      <text x="12" y="15" fill="#C4B5FD">NEXT.JS 15</text>

      <rect x="125" y="0" width="138" height="22" rx="6" fill="#17092E" stroke="#5B21B6" stroke-width="1" />
      <text x="137" y="15" fill="#67E8F9">GSAP + LENIS</text>

      <rect x="273" y="0" width="138" height="22" rx="6" fill="#17092E" stroke="#5B21B6" stroke-width="1" />
      <text x="285" y="15" fill="#F472B6">FRAMER MOTION</text>
    </g>

    <g transform="translate(0, 230)">
      <text x="0" y="0" fill="#6D5594" class="mono-chip" font-size="9.5">
        DIU FOUNDRY · AT THE INTERSECTION OF COGNITIVE CODE &amp; HAUTE DIGITAL ART
      </text>
    </g>
  </g>
</svg>